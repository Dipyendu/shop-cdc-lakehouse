[project]
name = "shop-cdc-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "confluent-kafka>=2.16.1",
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.4.0",
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
    "psycopg[binary]>=3.3.9",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
