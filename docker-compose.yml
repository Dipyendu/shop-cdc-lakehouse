# Run with: docker compose -p shopcdc ...
# Memory limits keep the whole stack under 1,536 MiB.
# postgres 256m + kafka 576m + connect 704m = 1536m.
services:
  postgres:
    image: postgres:17.12-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4", "-c", "shared_buffers=64MB"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop        # local-only demo database, not a secret
      POSTGRES_DB: shop
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 20
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: -1        # keep every event: the lander can replay from offset 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    ports: ["127.0.0.1:29092:29092"]
    volumes: [kafkadata:/var/lib/kafka/data]
    mem_limit: 576m
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on: [kafka, postgres]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: shopcdc-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms256m -Xmx384m"
    ports: ["127.0.0.1:8083:8083"]
    mem_limit: 704m
volumes:
  pgdata:
  kafkadata:
